<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner | Study Signal</title><link rel="stylesheet" href="css/style.css?v=20260909-planner"><link rel="stylesheet" href="css/planner.css?v=20260909">
</head><body>
<aside class="sidebar"><div class="brand"><div class="brand-icon">S</div><span>Study Signal</span></div><nav class="sidebar-nav"><a href="index.html" class="nav-item"><span>⌂</span>Dashboard</a><a href="index.html#courses" class="nav-item"><span>▣</span>My Courses</a><a href="planner.html" class="nav-item active"><span>▦</span>Planner</a><a href="progress.html" class="nav-item"><span>◔</span>Progress</a></nav><div class="sidebar-bottom"><div class="profile-card"><div class="profile-avatar"></div><div><strong></strong><small>Student</small></div></div></div></aside>
<main class="main-content planner-page">
 <header class="topbar"><div><p class="eyebrow">COURSE PLANNER</p><h1>What’s next?</h1><p class="subtitle">Assignments, exams, readings, and deadlines in one place.</p></div><div class="header-actions"><button class="secondary-tool-button" data-add-type="exam">+ Add Exam</button><button class="primary-button" data-add-type="assignment">+ Add Assignment</button></div></header>
 <div class="planner-toolbar"><div class="planner-tabs" role="tablist"><button data-view="today" role="tab">Today</button><button data-view="upcoming" role="tab" aria-selected="true">Upcoming</button><button data-view="calendar" role="tab">Calendar</button></div><div class="planner-filters"><select id="planner-course-filter" aria-label="Filter by course"><option value="">All courses</option></select><select id="planner-type-filter" aria-label="Filter by type"><option value="">All types</option><option value="assignment">Assignments</option><option value="exam">Exams</option><option value="quiz">Quizzes</option><option value="reading">Readings</option><option value="project">Projects</option><option value="paper">Papers</option><option value="other">Other</option></select></div></div>
 <section id="planner-list" class="planner-groups" aria-live="polite"><div class="friendly-empty">Loading planner…</div></section>
 <section id="planner-calendar" class="planner-calendar" hidden aria-label="Academic calendar"></section>
</main>
<div class="app-modal-overlay" id="task-modal"><div class="app-modal planner-modal" role="dialog" aria-modal="true" aria-labelledby="task-modal-title"><div class="app-modal-header"><div><p class="eyebrow">PLANNER ITEM</p><h2 id="task-modal-title">Add Assignment</h2></div><button class="icon-button" id="close-task-modal" aria-label="Close">×</button></div><form id="task-form" class="app-form"><div class="form-grid"><label>Course<select id="task-course" required></select></label><label>Type<select id="task-type"><option value="assignment">Assignment</option><option value="exam">Exam</option><option value="quiz">Quiz</option><option value="reading">Reading</option><option value="project">Project</option><option value="paper">Paper</option><option value="other">Other</option></select></label></div><label>Title<input id="task-title" maxlength="200" required placeholder="Problem set 4"></label><div class="form-grid"><label>Due date<input id="task-date" type="date" required></label><label>Due time <small>(optional)</small><input id="task-time" type="time"></label></div><label>Description<textarea id="task-description" maxlength="4000" rows="3" placeholder="Optional details"></textarea></label><div class="form-grid"><label>Unit <small>(optional)</small><select id="task-unit"><option value="">No unit</option></select></label><label>Linked material <small>(optional)</small><select id="task-material"><option value="">No material</option></select></label></div><label>Estimated study time <small>(minutes)</small><input id="task-minutes" type="number" min="1" step="1"></label><p class="form-error" id="task-form-error"></p><div class="app-modal-actions"><button type="button" class="danger-button" id="delete-task" hidden>Delete</button><button type="button" class="secondary-tool-button" id="cancel-task">Cancel</button><button type="submit" class="primary-button" id="save-task">Save Item</button></div></form></div></div>
<div class="app-modal-overlay" id="delete-task-modal"><div class="app-modal compact-modal" role="dialog" aria-modal="true" aria-labelledby="delete-task-title"><div class="app-modal-header"><div><p class="eyebrow">REMOVE PLANNER ITEM</p><h2 id="delete-task-title">Delete this task?</h2></div><button class="icon-button" id="close-delete-task" aria-label="Close">×</button></div><p id="delete-task-copy">This removes the item from your planner.</p><p class="form-error" id="delete-task-error"></p><div class="app-modal-actions"><button type="button" class="secondary-tool-button" id="cancel-delete-task">Cancel</button><button type="button" class="danger-button" id="confirm-delete-task">Delete Task</button></div></div></div>
<script src="js/config.js"></script><script src="js/course-colors.js?v=20260830-theme-fix"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/course-context.js"></script><script src="js/ui.js"></script><script src="js/planner-calendar-utils.js"></script><script src="js/planner.js"></script>
</body></html>
